# GIS stack for Dokploy: GeoServer + PostGIS + a one-shot publisher.
#
# Dokploy clones this repo on every deploy, so ./data always matches git.
# GeoServer's own config (workspaces, styles, users, tile cache) and the
# PostGIS database live in named volumes, which survive redeploys.
#
# Do not publish ports here: add a domain in Dokploy (service "geoserver",
# port 8080) and Traefik will route to it.

services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis}
      POSTGRES_USER: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  geoserver:
    image: docker.osgeo.org/geoserver:${GEOSERVER_VERSION:-2.27.1}
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?set GEOSERVER_ADMIN_PASSWORD}
      SKIP_DEMO_DATA: "true"
      ROOT_WEBAPP_REDIRECT: "true"
      # Browser clients (Leaflet / OpenLayers) on other origins need CORS.
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,HEAD,OPTIONS
      CORS_ALLOWED_HEADERS: "*"
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: ${GEOSERVER_EXTENSIONS:-}
      # The CSRF whitelist lets the web admin log in behind Traefik's HTTPS.
      EXTRA_JAVA_OPTS: >-
        -Xms${GEOSERVER_XMS:-1g} -Xmx${GEOSERVER_XMX:-2g}
        -DGEOSERVER_CSRF_WHITELIST=${GEOSERVER_DOMAIN:-localhost}

    volumes:
      - geoserver_data:/opt/geoserver_data
      # Source GIS files from git, read-only. Paths inside GeoServer: /data/...
      - ./data:/data:ro
      - ../files/bigdata:/bigdata:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/geoserver/web/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Runs once per deploy: registers every file in ./data with GeoServer and
  # loads GeoJSON into PostGIS. Safe to re-run; existing layers are kept.
  publisher:
    image: ghcr.io/osgeo/gdal:ubuntu-small-3.9.3
    restart: "no"
    depends_on:
      postgis:
        condition: service_healthy
      geoserver:
        condition: service_healthy
    environment:
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      GEOSERVER_WORKSPACE: ${GEOSERVER_WORKSPACE:-gis}
      PROXY_BASE_URL: ${PROXY_BASE_URL:-}
      DATA_DIR: /data
      PGHOST: postgis
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-gis}
      PGUSER: ${POSTGRES_USER:-gis}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data:/data:ro
      - ./run.py:/app/run.py:ro
    command: ["python3", "/app/run.py"]

volumes:
  geoserver_data:
  postgis_data:
